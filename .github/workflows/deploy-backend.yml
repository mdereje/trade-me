name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

env:
  PROJECT_ID: trade-me-13f73
  REGION: us-central1
  SERVICE_NAME: backend
  AR_REPO: trade-me
  CLOUDSQL_INSTANCE: trade-me-13f73:us-central1:trade-me-db

jobs:
  deploy-backend:
    name: Test, Migrate & Deploy Backend to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Run backend tests before deploying
        working-directory: ./backend
        env:
          ENV: test
          SECRET_KEY: ci-predeploy-test-secret
        run: |
          pip install -r requirements.txt
          pytest tests/ -v --tb=short

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        working-directory: ./backend
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}"
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Run Alembic database migrations via Cloud Run Job
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          gcloud run jobs deploy migrate-db \
            --image "${IMAGE}" \
            --region ${{ env.REGION }} \
            --set-secrets "DATABASE_URL=database-url:latest" \
            --set-cloudsql-instances ${{ env.CLOUDSQL_INSTANCE }} \
            --command alembic \
            --args upgrade,head \
            --project ${{ env.PROJECT_ID }}
          gcloud run jobs execute migrate-db --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} --wait

      - name: Deploy Backend to Cloud Run
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${IMAGE}" \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --timeout 300 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars "ENV=production,ALGORITHM=HS256,ACCESS_TOKEN_EXPIRE_MINUTES=60,FIREBASE_PROJECT_ID=${{ env.PROJECT_ID }},FRONTEND_URL=https://${{ env.PROJECT_ID }}.web.app,GCS_BUCKET_NAME=${{ env.PROJECT_ID }}-uploads,STRIPE_PRICE_MONTHLY_ID=${{ vars.STRIPE_PRICE_MONTHLY_ID }},STRIPE_PRICE_ANNUAL_ID=${{ vars.STRIPE_PRICE_ANNUAL_ID }}" \
            --set-secrets "DATABASE_URL=database-url:latest,SECRET_KEY=secret-key:latest,STRIPE_SECRET_KEY=stripe-secret-key:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest" \
            --add-cloudsql-instances ${{ env.CLOUDSQL_INSTANCE }} \
            --project ${{ env.PROJECT_ID }}

      - name: Get Cloud Run URL
        id: get-url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --format="value(status.url)" \
            --project ${{ env.PROJECT_ID }})
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_OUTPUT

      - name: Deployment Summary
        run: |
          echo "## Backend Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Via Firebase Hosting**: https://${{ env.PROJECT_ID }}.web.app/api/health" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Cloud Run URL**: ${{ steps.get-url.outputs.SERVICE_URL }}/health" >> $GITHUB_STEP_SUMMARY
