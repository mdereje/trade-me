name: Deploy Frontend to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
      - "firebase.json"
  workflow_dispatch:

env:
  PROJECT_ID: trade-me-13f73

jobs:
  deploy-frontend:
    name: Test, Build & Deploy Frontend to Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Lint and test frontend
        run: |
          npm --workspace=frontend run lint
          CI=true npm --workspace=frontend test -- --watchAll=false --passWithNoTests

      - name: Create production env file
        working-directory: ./frontend
        run: |
          # Leave REACT_APP_API_URL empty so requests use same-origin /api/** via Firebase Hosting rewrites
          echo "REACT_APP_API_URL=" > .env.production
          if [ -n "${{ secrets.REACT_APP_STRIPE_PUBLISHABLE_KEY }}" ]; then
            echo "REACT_APP_STRIPE_PUBLISHABLE_KEY=${{ secrets.REACT_APP_STRIPE_PUBLISHABLE_KEY }}" >> .env.production
          fi

      - name: Build frontend
        run: npm --workspace=frontend run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SA_KEY }}"
          channelId: live
          projectId: ${{ env.PROJECT_ID }}

      - name: Deployment Summary
        run: |
          echo "## Frontend Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://${{ env.PROJECT_ID }}.web.app" >> $GITHUB_STEP_SUMMARY
          echo "- **API Base**: https://${{ env.PROJECT_ID }}.web.app/api" >> $GITHUB_STEP_SUMMARY
